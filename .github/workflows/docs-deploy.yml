name: Deploy docs

# Deploys apps/docs to Vercel with the Vercel CLI. Vercel's Git integration
# only builds pull request previews: apps/docs/vercel.json turns off its
# deploys from main. See RELEASING.md.
#
#   merge to main            preview, aliased to next.swr-devtools-react.theflyer1983.dev
#   release.yml (`latest`)   production, from the release tag
#   run manually             production, from a chosen ref (default: npm's `latest`)
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'playgrounds/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to deploy to production. Leave empty for the version npm's `latest` dist-tag points to.
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy to production.
        required: true
        type: string
      skip-if-superseded:
        description: Skip the deploy when the repo has a newer stable vX.Y.Z tag than ref.
        required: false
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

# One production deploy at a time, never cancelled halfway. A newer merge to
# main replaces a preview deploy still in progress. When release.yml calls
# this workflow, github.* describes the tag push, so it counts as production.
concurrency:
  group: docs-deploy-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'next' || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@67.0.0
  NEXT_DOMAIN: next.swr-devtools-react.theflyer1983.dev
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  plan:
    name: Choose what to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.target.outputs.target }}
      ref: ${{ steps.target.outputs.ref }}
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - name: Choose the target and ref
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          SKIP_IF_SUPERSEDED: ${{ inputs.skip-if-superseded }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            target=preview
            ref="$GITHUB_SHA"
          else
            target=production
            ref="$INPUT_REF"
            if [ -z "$ref" ]; then
              if ! latest="$(npm view swr-devtools-react dist-tags.latest)"; then
                echo "::error::Couldn't read npm's latest version. Re-run once the registry responds, or pass a ref."
                exit 1
              fi
              ref="v$latest"
            fi
          fi
          # A re-run of an older release's docs job mustn't replace a newer
          # release's docs. Uses the repo's tags, like release.yml, because
          # npm's `latest` can lag just after a publish.
          deploy=true
          if [ "$SKIP_IF_SUPERSEDED" = true ]; then
            if ! tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')"; then
              echo "::error::Couldn't list the repository's version tags. Re-run the job."
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$tags" "$ref" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"
            if [ "$newest" != "$ref" ]; then
              deploy=false
            fi
          fi
          {
            echo "target=$target"
            echo "ref=$ref"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
          if [ "$deploy" = true ]; then
            echo "Deploying \`$ref\` to $target." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: \`$newest\` is newer than \`$ref\`. To deploy \`$ref\` anyway, run Deploy docs by hand with it as the ref." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Vercel
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pull the Vercel project settings
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      # Runs the project's build command from the Vercel settings (Root
      # Directory apps/docs), which builds packages/react and then the docs.
      - name: Build
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=()
          if [ "$TARGET" = production ]; then args+=(--prod); fi
          npx --yes "$VERCEL_CLI" build "${args[@]}" --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=()
          if [ "$TARGET" = production ]; then args+=(--prod); fi
          # The CLI prints only the deployment URL to stdout; progress goes to stderr.
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt "${args[@]}" --token="$VERCEL_TOKEN")"
          if ! [[ "$url" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::Expected a deployment URL from vercel deploy, got: $url"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      # Preview URLs need a Vercel login. The custom domain makes main's
      # preview public, for people trying unreleased changes.
      - name: Point next.swr-devtools-react at the preview
        if: needs.plan.outputs.target == 'preview'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "$VERCEL_CLI" alias set "${URL#https://}" "$NEXT_DOMAIN" --token="$VERCEL_TOKEN"
          echo "Aliased to https://$NEXT_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
