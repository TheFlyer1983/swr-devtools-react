name: Release

# Publishes to npm when a version tag is pushed, including tags created
# through a GitHub Release. Ordinary merges never publish. See RELEASING.md.
on:
  push:
    tags: ['v*']

# Never cancel a release halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main. Tag a commit that has been merged to main."
            exit 1
          fi
      - name: Check the tag matches the package version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./packages/react/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/react/package.json version $package_version."
            exit 1
          fi
          # Prereleases (1.0.0-beta.1, 1.0.0-rc.0) go to `next`, so
          # `npm install swr-devtools-react` never picks them up.
          case "$package_version" in
            *-*) dist_tag=next; prerelease=true ;;
            *) dist_tag=latest; prerelease=false ;;
          esac
          {
            echo "version=$package_version"
            echo "dist-tag=$dist_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $package_version to the npm \`$dist_tag\` dist-tag." >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Full check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, format check, typecheck, test and build
        run: pnpm check

  publish:
    name: Publish to npm
    needs: [verify, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protection rules (such as required reviewers) on this environment gate
    # the publish. npm's trusted publisher entry names it too.
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing: an OIDC token instead of an NPM_TOKEN secret.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack, then check the tarball with publint and arethetypeswrong
        run: pnpm check:package
      - name: Publish the checked tarball
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        # Trusted publishing needs npm 11.5.1 or later, which Node 24.11+ ships.
        run: npm publish .pack/swr-devtools-react.tgz --provenance --access public --tag "$DIST_TAG"

  release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The section between "## <version>" and the next "## " heading.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/react/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::packages/react/CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # A tag created through the GitHub UI already has a release: fill in
          # its notes rather than creating a second one.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE"
          fi
