name: Release

# Publishes to npm when a version tag is pushed, including tags created
# through a GitHub Release. Ordinary merges never publish. See RELEASING.md.
on:
  push:
    tags: ['v*']

# Never cancel a release halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and all branches, so the tagged commit can be checked
          # against main and the release branches.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main or a release branch
        run: |
          branches="$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' | grep -xE 'origin/(main|release/.+)' || true)"
          if [ -z "$branches" ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main or a release/* branch. Tag a commit that has been merged to one of them."
            exit 1
          fi
          echo "Tagged commit is on: $(echo "$branches" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the tag matches the package version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./packages/react/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/react/package.json version $package_version."
            exit 1
          fi
          case "$package_version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$package_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG.md has an entry for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked here rather than only in the release job, so a missing entry
        # stops the run before anything is published.
        run: |
          if ! grep -qxF "## $VERSION" packages/react/CHANGELOG.md 2>/dev/null; then
            echo "::error::packages/react/CHANGELOG.md has no '## $VERSION' section. Run pnpm changeset version in the release PR."
            exit 1
          fi

  check:
    name: Full check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, format check, typecheck, test and build
        run: pnpm check

  publish:
    name: Publish to npm
    needs: [verify, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protection rules (such as required reviewers) on this environment gate
    # the publish. npm's trusted publisher entry names it too.
    environment: npm
    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.dist-tag }}
    # One publish at a time across all releases, so two can't both decide
    # they're `latest`. GitHub keeps one waiting run per group: with three
    # releases at once, the middle one is cancelled and needs a re-run.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      # npm trusted publishing: an OIDC token instead of an NPM_TOKEN secret.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack, then check the tarball with publint and arethetypeswrong
        run: pnpm check:package
      - name: Choose the npm dist-tag
        id: dist-tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        # Decided here, after the environment approval and just before
        # publishing, so a release published while this one waited is counted.
        # Prereleases go to `next`. A stable version older than `latest` (0.1.3
        # after 0.2.0) goes to `release-0.1`, so `latest` stays on the newest.
        # npm's answer can lag just after another publish, so the repo's
        # stable tags count too: each release is tagged before it publishes.
        run: |
          case "$VERSION" in
            *-*) dist_tag=next ;;
            *)
              if ! current_latest="$(npm view swr-devtools-react dist-tags.latest)"; then
                echo "::error::Couldn't read the current npm latest version. Re-run the job once the registry responds."
                exit 1
              fi
              if ! tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/v")')"; then
                echo "::error::Couldn't list the repository's version tags. Re-run the job."
                exit 1
              fi
              newest="$(printf '%s\n%s\n%s\n' "$current_latest" "$tags" "$VERSION" | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"
              if [ "$newest" = "$VERSION" ]; then
                dist_tag=latest
              else
                dist_tag="release-${VERSION%.*}"
              fi
              ;;
          esac
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to the npm \`$dist_tag\` dist-tag." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the checked tarball
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.dist-tag }}
        # Trusted publishing needs npm 11.5.1 or later, which Node 24.11+ ships.
        run: npm publish .pack/swr-devtools-react.tgz --provenance --access public --tag "$DIST_TAG"

  docs:
    name: Deploy docs
    needs: publish
    # Only when this version became npm's `latest`. Prereleases (`next`) and
    # hotfixes to older lines (`release-0.1`) leave the docs on the newest
    # stable version. The deploy workflow checks the tags again, so re-running
    # this job after a newer release doesn't bring back older docs.
    if: needs.publish.outputs.dist-tag == 'latest'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-deploy.yml
    with:
      ref: ${{ github.ref_name }}
      skip-if-superseded: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One release job at a time, so reading the existing releases and marking
    # this one latest can't interleave with another release doing the same.
    concurrency:
      group: github-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The section between "## <version>" and the next "## " heading.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/react/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::packages/react/CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # Decided now rather than taken from the publish job, so a release
          # published in between (or a re-run of this job alone) is counted.
          # Only the newest stable version is marked latest. Uses the repo's
          # tags, like the publish job, so a newer version whose GitHub Release
          # step failed still counts.
          latest=false
          if [ "$PRERELEASE" = false ]; then
            if ! tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')"; then
              echo "::error::Couldn't list the repository's version tags. Re-run the job."
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$tags" "$GITHUB_REF_NAME" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"
            if [ "$newest" = "$GITHUB_REF_NAME" ]; then
              latest=true
            fi
          fi
          echo "Marking the GitHub Release as latest: $latest" >> "$GITHUB_STEP_SUMMARY"

          # A tag created through the GitHub UI already has a release: fill in
          # its notes rather than creating a second one.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE" --latest="$latest"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE" --latest="$latest"
          fi
